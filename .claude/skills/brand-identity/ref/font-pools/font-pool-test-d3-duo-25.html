<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Font Pool — test-d3-duo-25</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Press%20Start%202P:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #FFFFFF; color: #1A1A1A;
      padding: 24px 32px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .header {
      font-size: 11px; text-transform: uppercase; letter-spacing: 2px;
      color: #999; margin-bottom: 20px; padding-bottom: 12px;
      border-bottom: 1px solid #E5E7EB;
    }
    .row {
      display: grid;
      grid-template-columns: 60px 1fr 1fr;
      gap: 24px;
      align-items: baseline;
      padding: 14px 0;
      border-bottom: 1px solid #F5F5F5;
    }
    .num {
      font-size: 20px; font-weight: 700; color: #BBB;
      font-family: monospace;
      padding-top: 8px;
    }
    .sample {
      font-size: 48px; line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sample-light {
      font-size: 28px; line-height: 1.4;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="header">Font Pool test-d3-duo-25 — 2 fonts (#01–#02) — sample: "Ag Stratégie & Vision 2026"</div>
  
    <div class="row">
      <div class="num">01</div>
      <div class="sample" style="font-family:'Silkscreen',serif; font-weight:700">
        Ag Stratégie & Vision 2026
      </div>
      <div class="sample-light" style="font-family:'Silkscreen',serif; font-weight:400">
        abcdefghijklmnopqrstuvwxyz 0123456789
      </div>
    </div>
    <div class="row">
      <div class="num">02</div>
      <div class="sample" style="font-family:'Press Start 2P',serif; font-weight:700">
        Ag Stratégie & Vision 2026
      </div>
      <div class="sample-light" style="font-family:'Press Start 2P',serif; font-weight:400">
        abcdefghijklmnopqrstuvwxyz 0123456789
      </div>
    </div>
</body>
</html>
