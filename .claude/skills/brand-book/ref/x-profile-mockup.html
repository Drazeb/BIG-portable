<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{BRAND_NAME}} — X (Twitter) profile mockup</title>
    <meta name="viewport" content="width=1000, initial-scale=1">

    <!-- Fonts marque — utilisées UNIQUEMENT pour le wordmark de l'avatar (et un éventuel
         overlay cover). Tout le reste de l'UI X reste en stack system natif. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="{{BRAND_PRIMARY_FONT_URL}}" rel="stylesheet">

    <style>
        /* =========================================================================
           VARIABLES MARQUE — substituées par Mustache à la génération.
           IMPORTANT : la marque ne customise QUE deux choses :
             1. l'image de cover ({{COVER_IMAGE_URL}})
             2. le wordmark de l'avatar ({{AVATAR_HTML}}, qui utilise --brand-display)
           Tout le reste (UI X) est strictement officiel — mode light, couleurs X,
           typo system. C'est ça le mockup X : l'UI ne bouge pas, la marque ne signe
           que dans cover + avatar.
           ========================================================================= */
        :root {
            --brand-display: {{BRAND_DISPLAY}};
            --brand-body: {{BRAND_BODY}};
            --brand-dark-bg: {{BRAND_DARK_BG}};

            /* =========================================================================
               Couleurs X officielles (MODE LIGHT — le X "officiel" ne change jamais
               son UI, peu importe la marque qui le poste). Constantes immuables.
               ========================================================================= */
            --x-bg: #ffffff;                 /* fond page (mode light X) */
            --x-text-primary: #0f1419;       /* texte principal (presque noir) */
            --x-text-secondary: #536471;     /* gris X — méta, handle, secondaire */
            --x-border: #eff3f4;             /* bordures et séparateurs très clairs */
            --x-hover-bg: #f7f9f9;           /* fond hover boutons icônes */
            --x-blue: #1d9bf0;               /* badge vérifié bleu (et liens) */
            --x-btn-bg: #bc3afb;             /* bouton "Souscrire" — rose X Premium officiel */
            --x-btn-text: #ffffff;           /* texte du bouton "Souscrire" sur fond rose */
            --x-header-bg: rgba(255,255,255,0.85); /* header sticky semi-transparent */
        }

        /* =========================================================================
           Reset + base
           ========================================================================= */
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            /* X utilise une stack system pour TOUT le texte du profil — on garde
               le réalisme. La font marque (--brand-display) est utilisée UNIQUEMENT
               pour le wordmark de l'avatar + éventuels overlays cover. */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--x-bg);
            color: var(--x-text-primary);
            min-width: 1000px;
        }

        /* =========================================================================
           Layout : standalone (pas de colonnes nav X). Format quasi-carré 1000×1000
           calibré sur la référence Khairallah AL-Awady (X profile desktop) :
           avatar 290px (~29% largeur), nom 46px, bio 25px, méta 23px, boutons gros.
           Le contenu remplit le viewport sans espace blanc en bas.
           ========================================================================= */
        .x-page {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            background: var(--x-bg);
        }

        /* =========================================================================
           Header X sticky : barre haute style X actuel, ~53px, fond blanc semi-
           transparent avec backdrop-blur. Contient back arrow + nom + posts count
           à gauche, et 2 icônes (mute + search) à droite.
           ========================================================================= */
        .x-topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 0;
            height: 70px;
            padding: 0 24px;
            background: var(--x-header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--x-border);
        }
        .x-topbar-back {
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            border-radius: 9999px;
            color: var(--x-text-primary);
            cursor: default;
            padding: 0;
            margin-right: 36px;
        }
        .x-topbar-back svg {
            width: 26px;
            height: 26px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .x-topbar-title {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
            min-width: 0;
        }
        .x-topbar-name {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 30px;
            font-weight: 800;
            line-height: 1.2;
            color: var(--x-text-primary);
            letter-spacing: -0.01em;
        }
        .x-topbar-name .x-verified-small {
            width: 26px;
            height: 26px;
            color: var(--x-blue);
            flex-shrink: 0;
        }
        .x-topbar-posts {
            font-size: 17px;
            line-height: 1.3;
            color: #536471;
        }
        .x-topbar-actions {
            display: inline-flex;
            align-items: center;
            gap: 30px;
            margin-left: 16px;
        }
        .x-topbar-icon {
            width: 26px;
            height: 26px;
            color: var(--x-text-primary);
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* =========================================================================
           Cover bandeau ~1000×360 (ratio ~2.78:1 — calé sur la référence Khairallah).
           ========================================================================= */
        .x-cover {
            position: relative;
            width: 100%;
            height: 360px;
            background-image: url('{{COVER_IMAGE_URL}}');
            background-size: cover;
            background-position: center;
            background-color: var(--brand-dark-bg);
        }
        /* Slot pour overlay wordmark (optionnel — injecté par {{COVER_OVERLAY_HTML}}) */
        .x-cover-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        /* =========================================================================
           Header info : ligne actions (haut-droite) + avatar + nom + bio + méta + stats
           ========================================================================= */
        .x-header {
            position: relative;
            padding: 0 28px 36px;
        }

        /* Barre d'actions en haut-droite, ALIGNÉE sur la baseline du nom (juste sous la cover).
           Elle chevauche la zone où l'avatar dépasse, mais reste à droite donc pas de conflit. */
        .x-actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            padding: 20px 0 16px;
            min-height: 160px; /* réserve l'espace pour l'avatar 290px qui dépasse de -145px */
        }
        .x-icon-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 1px solid #cfd9de; /* gris X actions, mode light */
            background: transparent;
            color: var(--x-text-primary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: default;
            padding: 0;
        }
        .x-icon-btn svg {
            width: 30px;
            height: 30px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        /* Bouton "Souscrire" — couleur X Premium STRICTE (rose #bc3afb + blanc texte).
           PAS de couleur marque ici : le UI X ne change pas. */
        .x-btn-subscribe {
            font-family: inherit;
            font-size: 26px;
            font-weight: 700;
            line-height: 1;
            padding: 0 34px;
            height: 68px;
            border-radius: 9999px;
            background: #bc3afb;
            color: #ffffff;
            border: none;
            cursor: default;
        }

        /* Avatar rond 290×290 (~29% largeur du viewport 1000px) — calé sur la référence Khairallah. */
        .x-avatar-wrap {
            position: absolute;
            left: 28px;
            top: 0;
            margin-top: -145px; /* l'avatar dépasse d'environ 50% de sa hauteur sur la cover */
            width: 290px;
            height: 290px;
            border-radius: 50%;
            background: var(--x-bg); /* bordure = couleur du fond (blanc en mode light) */
            padding: 6px;
        }
        .x-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            background: var(--brand-dark-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        /* Identité : nom + handle + bio + méta + stats — TOUT en typo X system,
           pas de var(--brand-display) ici. Le {{BRAND_NAME}} est juste du texte. */
        .x-identity {
            padding-top: 24px;
        }
        .x-name-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 0;
        }
        .x-name {
            font-family: inherit;
            font-size: 46px;
            font-weight: 800;
            line-height: 1.2;
            color: var(--x-text-primary);
            letter-spacing: -0.01em;
            margin: 0;
        }

        /* Badge vérifié X (bleu, "coche" stylisée). */
        .x-verified {
            width: 34px;
            height: 34px;
            color: var(--x-blue);
            flex-shrink: 0;
        }
        .x-handle {
            font-size: 22px;
            line-height: 1.3;
            color: #536471;
            margin: 0 0 24px;
        }
        .x-bio {
            font-size: 25px;
            line-height: 34px;
            color: #0f1419;
            margin: 0 0 26px;
            max-width: 880px;
        }

        /* Méta : grille de chips (icône + texte) sur 2 lignes. */
        .x-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 26px;
            margin: 0 0 24px;
        }
        .x-meta-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 23px;
            line-height: 1.3;
            color: #536471;
        }
        .x-meta-item svg {
            width: 26px;
            height: 26px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }
        .x-meta-link {
            color: var(--x-blue);
            text-decoration: none;
        }

        /* Stats : abonnements / abonnés en horizontal (pas en cards). */
        .x-stats {
            display: flex;
            gap: 36px;
            margin: 0 0 24px;
        }
        .x-stats-item {
            font-size: 21px;
            color: #536471;
        }
        .x-stats-item strong {
            font-size: 21px;
            color: #0f1419;
            font-weight: 700;
            margin-right: 6px;
        }

        /* "Suivi par" : mini-avatars empilés à gauche + texte. */
        .x-followed-by {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            color: #536471;
            line-height: 1.3;
        }
        .x-followed-avatars {
            display: inline-flex;
            flex-shrink: 0;
        }
        .x-followed-avatars .x-mini-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid var(--x-bg);
            background: var(--x-text-secondary);
            margin-left: -8px;
        }
        .x-followed-avatars .x-mini-avatar:first-child { margin-left: 0; }
    </style>
</head>
<body>

    <!-- ====================================================================
         PROFIL X — pas de colonnes nav X (zone à intégrer dans brand book).
         Mode LIGHT strict : seuls cover + avatar sont customisés par la marque.
         ==================================================================== -->
    <div class="x-page">

        <!-- HEADER X sticky (barre haute style X actuel, ~53px) -->
        <div class="x-topbar">
            <button class="x-topbar-back" aria-label="Back">
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <div class="x-topbar-title">
                <span class="x-topbar-name">
                    {{BRAND_NAME}}
                    <svg class="x-verified-small" viewBox="0 0 24 24" fill="currentColor" aria-label="Verified">
                        <path d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.66-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.91-.2-3.92.81s-1.26 2.52-.8 3.91c-1.31.67-2.2 1.91-2.2 3.34s.89 2.67 2.2 3.34c-.46 1.39-.21 2.9.8 3.91s2.52 1.26 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.68-.88 3.34-2.19c1.39.45 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34zm-11.71 4.2L6.8 12.46l1.41-1.42 2.26 2.26 4.8-5.23 1.47 1.36-6.2 6.77z"/>
                    </svg>
                </span>
                <span class="x-topbar-posts">{{POSTS_COUNT}} posts</span>
            </div>
            <div class="x-topbar-actions">
                <!-- Search / loupe — seule icône d'action en haut à droite (cf. spec sanctuarisée 27 mai 2026) -->
                <svg class="x-topbar-icon" viewBox="0 0 24 24" aria-label="Search">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </div>
        </div>

        <!-- COVER bandeau image marque (3:1) + slot overlay optionnel -->
        <div class="x-cover">
            <div class="x-cover-overlay">
                {{COVER_OVERLAY_HTML}}
            </div>
        </div>

        <!-- HEADER : actions haut-droite + avatar (overflow cover) + identité -->
        <header class="x-header">

            <!-- Actions en haut-droite (au-dessus de l'identité, à côté de l'avatar) -->
            <div class="x-actions">
                <!-- More (⋯) -->
                <button class="x-icon-btn" aria-label="More">
                    <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>
                </button>
                <!-- Message -->
                <button class="x-icon-btn" aria-label="Message">
                    <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                </button>
                <!-- Notify (bell) -->
                <button class="x-icon-btn" aria-label="Notify">
                    <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                </button>
                <!-- Add to list (person+) -->
                <button class="x-icon-btn" aria-label="Add to list">
                    <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                </button>
                <!-- Bouton Souscrire — couleur X officielle (noir fond + blanc texte) -->
                <button class="x-btn-subscribe">Souscrire</button>
            </div>

            <!-- Avatar rond chevauchant la cover (positionné en absolute à gauche, -84px) -->
            <div class="x-avatar-wrap">
                <div class="x-avatar">
                    {{AVATAR_HTML}}
                </div>
            </div>

            <!-- Bloc identité : nom + handle + bio + méta + stats + followed-by -->
            <div class="x-identity">

                <div class="x-name-row">
                    <h1 class="x-name">{{BRAND_NAME}}</h1>
                    <!-- Badge vérifié X (coche bleue stylisée) -->
                    <svg class="x-verified" viewBox="0 0 24 24" fill="currentColor" aria-label="Verified">
                        <path d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.66-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.91-.2-3.92.81s-1.26 2.52-.8 3.91c-1.31.67-2.2 1.91-2.2 3.34s.89 2.67 2.2 3.34c-.46 1.39-.21 2.9.8 3.91s2.52 1.26 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.68-.88 3.34-2.19c1.39.45 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34zm-11.71 4.2L6.8 12.46l1.41-1.42 2.26 2.26 4.8-5.23 1.47 1.36-6.2 6.77z"/>
                    </svg>
                </div>

                <p class="x-handle">{{HANDLE}}</p>

                <p class="x-bio">{{BIO}}</p>

                <!-- Méta : briefcase · pin · link · cake · calendar (≤ 5 chips) -->
                <div class="x-meta">
                    <span class="x-meta-item">
                        <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                        {{META_CATEGORY}}
                    </span>
                    <span class="x-meta-item">
                        <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                        {{META_LOCATION}}
                    </span>
                    <span class="x-meta-item">
                        <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                        <a class="x-meta-link" href="#">{{META_URL}}</a>
                    </span>
                    <span class="x-meta-item">
                        <svg viewBox="0 0 24 24"><path d="M20 21V10H4v11"/><path d="M3 10l9-7 9 7"/><path d="M9 14v3"/><path d="M15 14v3"/><path d="M12 11v6"/></svg>
                        {{META_BIRTHDAY}}
                    </span>
                    <span class="x-meta-item">
                        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                        {{META_JOINED}}
                    </span>
                </div>

                <!-- Stats horizontales (pas en cards) -->
                <div class="x-stats">
                    <span class="x-stats-item"><strong>{{STATS_FOLLOWING}}</strong>abonnements</span>
                    <span class="x-stats-item"><strong>{{STATS_FOLLOWERS}}</strong>abonnés</span>
                </div>

                <!-- "Suivi par" : 3 mini-avatars empilés à gauche -->
                <div class="x-followed-by">
                    <span class="x-followed-avatars">
                        <span class="x-mini-avatar" style="background:#d9b285;"></span>
                        <span class="x-mini-avatar" style="background:#7a8d9c;"></span>
                        <span class="x-mini-avatar" style="background:#4a5d6e;"></span>
                    </span>
                    <span>{{FOLLOWED_BY}}</span>
                </div>

            </div>
        </header>

    </div>

</body>
</html>
